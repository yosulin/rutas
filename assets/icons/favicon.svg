<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <rect x="0" y="0" width="100" height="100" rx="14" fill="#161a20"/>

  <!-- back peak -->
  <path d="M 6 82 L 32 34 L 50 82 Z" fill="#1e242c" stroke="#2f8f6d" stroke-width="1" stroke-linejoin="round"/>

  <!-- front / main peak (matterhorn-esque, slightly concave faces) -->
  <path d="M 58 14
           C 52 30, 48 44, 40 58
           C 34 66, 26 74, 18 82
           L 92 82
           C 84 72, 76 60, 70 46
           C 66 36, 62 24, 58 14 Z"
        fill="none" stroke="#4fcf9d" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- snow cap -->
  <path d="M 58 14 L 66 27 L 58 24 L 50 28 Z" fill="#eef6f2"/>

  <!-- trail, dashed, winding to the summit -->
  <path d="M 82 82 C 74 76, 66 78, 60 70 C 54 62, 62 56, 56 48 C 50 40, 58 34, 58 26"
        fill="none" stroke="#e0a53f" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="4.5 4.2" opacity="0.95"/>

  <!-- trail marker dot at summit -->
  <circle cx="58" cy="24" r="2.4" fill="#e0a53f"/>
</svg>